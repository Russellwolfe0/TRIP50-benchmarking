# GitHub Pages (Jekyll) settings. The site only needs the HTML/JS/CSS, images/,
# data/final/ and calculations/conformer_study/conformer_analysis/; publishing
# the raw calculations (~23k files) makes the Pages deploy time out.
exclude:
  - README.md
  - requirements.txt
  - docs
  - scripts
  - structures
  - configs
  - data/intermediate
  - calculations/single_points
  - calculations/mlip_results
  - calculations/gxtb_results
  - calculations/conformer_study/best_conformers_ordered
  - calculations/conformer_study/conformer_optimization_results
  - calculations/conformer_study/conformer_optimizations
  - calculations/conformer_study/conformer_xyz
  - calculations/conformer_study/dft_checks
  - calculations/conformer_study/optimizations
  - calculations/conformer_study/reference_conformers
  - calculations/conformer_study/reference_smiles
  - calculations/conformer_study/reference_smiles.csv
  - calculations/conformer_study/CSEARCH_data.dat
